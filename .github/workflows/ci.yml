name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q server tools tests

      - name: Validate one-click PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\START_ASSAULT_FIRE.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object {
              Write-Error ("PowerShell parse error: " + $_.Message)
            }
            exit 1
          }
          Write-Host "START_ASSAULT_FIRE.ps1 syntax: PASS"

      - name: Run test suite
        run: python -m pytest -v tests
